# Supabase CLI settings for this project's Edge Functions (used by `supabase functions deploy`).
# medius-chat answers signed-in players only: the platform checks the player's JWT before the function runs
# (it accepts the project's ES256 / RS256 signing keys and legacy HS256), and the function checks it again.
[functions.medius-chat]
verify_jwt = true

# luna-chat answers signed-in players only, same as medius-chat.
[functions.luna-chat]
verify_jwt = true


# food-guess answers signed-in players only, same as medius-chat.
[functions.food-guess]
verify_jwt = true
